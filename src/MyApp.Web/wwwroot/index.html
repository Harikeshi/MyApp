<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои задачи</title>
    <style>
        <!-->
    </style>
</head>
<body>
    <header id="topbar" hidden>
        <span id="userName"></span>
        <button id="logout">Выйти</button>
    </header>
    <h1>Мои задачи</h1>
    <div id="msg" class="msg" role="status"></div>

    <section id="auth">
        <h2 id="authTitle">Вход</h2>
        <label id="nameRow" hidden>Имя пользователя <input id="displayName" type="text" maxlength="30" autocomplete="nickname"></label>
        <label>Почта <input id="email" type="email" autocomplete="username"></label>
        <label id="pwdRow">Пароль <input id="password" type="password" autocomplete="current-password"></label>
        <div id="captcha"></div>
        <div class="row" id="loginButtons"><button id="login">Войти</button></div>
        <div class="row" id="registerButtons" hidden><button id="register">Зарегистрироваться</button></div>
        <div class="row" id="forgotButtons" hidden><button id="sendReset">Отправить ссылку</button></div>
        <p>
            <a href="#" id="toRegister">Создать аккаунт</a>
            <a href="#" id="forgotLink">Забыли пароль?</a>
            <a href="#" id="toLogin" hidden>Назад ко входу</a>
        </p>
    </section>

    <section id="reset" hidden>
        <h2>Новый пароль</h2>
        <label>Новый пароль <input id="newPassword" type="password" autocomplete="new-password"></label>
        <label>Повторите пароль <input id="newPassword2" type="password" autocomplete="new-password"></label>
        <button id="doReset">Сохранить пароль</button>
    </section>
    <section id="app" hidden>
        <nav id="tabs">
            <button data-tab="todos" class="active">Задачи</button>
            <button data-tab="stats">Статистика</button>
        </nav>

        <div id="tab-todos">
            <!-- здесь прежнее содержимое: поля новой задачи и <ul id="list"> -->
            <div class="row">
                <input id="title" type="text" maxlength="200" placeholder="Новая задача">
            </div>
            <div class="row">
                <input id="due" type="date" title="Срок">
                <select id="priority" title="Приоритет">
                    <option value="low">Низкий</option>
                    <option value="normal" selected>Обычный</option>
                    <option value="high">Высокий</option>
                </select>
                <button id="add">Добавить</button>
            </div>
            <ul id="list"></ul>
        </div>
        <div id="tab-stats" hidden>
            <div id="react-root"></div>
        </div>
    </section>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstile" async defer></script>
    <script>
        const SITEKEY = "0x4AAAAAAFhQ9qvfK9asJRtG";   // публичный ключ Turnstile; пусто = captcha отключена
        const $ = id => document.getElementById(id);
        let token = sessionStorage.getItem("token");
        let widgetId = null;

        window.onTurnstile = () => {
            if (SITEKEY) widgetId = window.turnstile.render("#captcha", { sitekey: SITEKEY });
        };

        function show(text, ok = false) {
            const m = $("msg");
            m.textContent = text;
            m.className = "msg " + (ok ? "ok" : "err");
        }

        async function api(path, { method = "GET", body, captcha = false } = {}) {
            const headers = {};
            if (body) headers["Content-Type"] = "application/json";
            if (token) headers["Authorization"] = "Bearer " + token;

            const useCaptcha = captcha && SITEKEY && widgetId !== null;
            if (useCaptcha) headers["X-Captcha-Token"] = window.turnstile.getResponse(widgetId) || "";

            let res;
            try {
                res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
            } catch {
                return Response.error();                       // сети нет: status 0, res.ok === false
            } finally {
                if (useCaptcha) window.turnstile.reset(widgetId);   // токен одноразовый
            }

            if (res.status === 401 && token && path !== "/logout") logout("Сессия истекла, войдите снова");
            return res;
        }

        async function errorText(res) {
            if (res.status === 0) return "Нет связи с сервером, попробуйте ещё раз";
            if (res.status === 429) return "Слишком много запросов, подождите минуту";
            try {
                const data = await res.json();
                if (data.errors && data.errors.InvalidToken) return "Ссылка недействительна или устарела: запросите сброс заново";
                if (data.errors && (data.errors.DuplicateEmail/*  || data.errors.DuplicateUserName */))
                    return "Эта почта уже зарегистрирована";
                if (data.errors) return Object.values(data.errors).flat().join(" ");
                if (data.error === "captcha_required") return "Пройдите проверку captcha";
                if (data.error === "captcha_failed") return "Проверка captcha не пройдена, попробуйте ещё раз";
                if (data.detail === "NotAllowed") return "Почта не подтверждена: перейдите по ссылке из письма";
                if (data.detail === "LockedOut") return "Аккаунт временно заблокирован из-за неудачных попыток входа";
                if (res.status === 401) return "Неверная почта или пароль";
            } catch { /* тело не JSON */ }
            return "Ошибка " + res.status;
        }

        const creds = () => ({ email: $("email").value.trim(), password: $("password").value });

     

        async function login() {
            const res = await api("/login", { method: "POST", body: creds(), captcha: true });
            if (!res.ok) return show(await errorText(res));
            token = (await res.json()).accessToken;
            sessionStorage.setItem("token", token);
            $("password").value = "";
            show("");
            await showApp();
        }

        function setMode(mode) {                      // "login" | "register" | "forgot"
            const titles = { login: "Вход", register: "Регистрация", forgot: "Сброс пароля" };
            $("authTitle").textContent = titles[mode];
            $("nameRow").hidden = mode !== "register";
            $("pwdRow").hidden = mode === "forgot";
            $("password").autocomplete = mode === "register" ? "new-password" : "current-password";
            $("loginButtons").hidden = mode !== "login";
            $("registerButtons").hidden = mode !== "register";
            $("forgotButtons").hidden = mode !== "forgot";
            $("toRegister").hidden = mode !== "login";
            $("forgotLink").hidden = mode !== "login";
            $("toLogin").hidden = mode === "login";
            show("");
        }

        async function register() {
            const displayName = $("displayName").value.trim();
            if (displayName.length < 2) return show("Введите имя пользователя (от 2 до 30 символов)");
            const res = await api("/account/register", {
                method: "POST",
                body: { email: $("email").value.trim(), password: $("password").value, displayName },
                captcha: true
            });
            if (!res.ok) return show(await errorText(res));
            setMode("login");
            show("Готово. Проверьте почту, подтвердите адрес и затем войдите.", true);
        }

        async function loadUser() {
            const res = await api("/me");
            if (!res.ok) return;
            const me = await res.json();
            $("userName").textContent = me.name;
            $("userName").title = me.email;
        }

        async function showApp() {
            $("auth").hidden = true;
            $("app").hidden = false;
            $("topbar").hidden = false;
            await Promise.all([loadUser(), loadTodos()]);
        }

        function logout(message = "") {
            token = null;
            sessionStorage.removeItem("token");
            $("app").hidden = true;
            $("topbar").hidden = true;
            $("userName").textContent = "";
            $("auth").hidden = false;
            show(message);
        }

        const PRIORITY_LABEL = { low: "низкий", normal: "", high: "высокий" };

        function formatDate(iso) {                       // "2027-01-15" -> "15.01.2027", без сдвига часовых поясов
            const [y, m, d] = iso.split("-");
            return `${d}.${m}.${y}`;
        }

        async function loadTodos() {
            const res = await api("/todos");
            if (!res.ok) {
                show("Не удалось загрузить задачи: " + await errorText(res));
                return;
            }
            const today = new Date().toLocaleDateString("sv-SE");        // локальная дата в виде YYYY-MM-DD
            const list = $("list");
            list.replaceChildren();

            for (const t of await res.json()) {
                const li = document.createElement("li");
                li.className = [t.isDone ? "done" : "", t.priority].filter(Boolean).join(" ");

                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.checked = t.isDone;
                cb.onchange = async () => {
                    const r = await api(`/todos/${t.id}`, {
                        method: "PUT",
                        body: { title: t.title, isDone: cb.checked, dueDate: t.dueDate, priority: t.priority }
                    });
                    if (!r.ok) show(await errorText(r));
                    loadTodos();
                };

                const span = document.createElement("span");
                span.textContent = t.title;

                li.append(cb, span);

                if (PRIORITY_LABEL[t.priority]) {
                    const prio = document.createElement("span");
                    prio.className = "prio";
                    prio.textContent = PRIORITY_LABEL[t.priority];
                    li.append(prio);
                }
                if (t.dueDate) {
                    const due = document.createElement("span");
                    due.className = "due" + (!t.isDone && t.dueDate < today ? " overdue" : "");
                    due.textContent = formatDate(t.dueDate);
                    li.append(due);
                }

                const del = document.createElement("button");
                del.textContent = "Удалить";
                del.onclick = async () => { await api(`/todos/${t.id}`, { method: "DELETE" }); loadTodos(); };
                li.append(del);

                list.append(li);
            }
        }

        async function addTodo() {
            const title = $("title").value.trim();
            if (!title) return;
            const body = { title, priority: $("priority").value };
            const due = $("due").value;
            if (due) body.dueDate = due;

            const res = await api("/todos", { method: "POST", body });
            if (res.ok) {
                $("title").value = "";
                $("due").value = "";
                $("priority").value = "normal";
                loadTodos();
            } else {
                show(await errorText(res));
            }
        }
       
        async function sendReset() {
            const email = $("email").value.trim();
            if (!email) return show("Введите почту");
            const res = await api("/account/forgot", { method: "POST", body: { email }, captcha: true });
            if (res.ok) return show("Мы отправили письмо со ссылкой для сброса пароля.", true);
            if (res.status === 404) {
                const data = await res.clone().json().catch(() => null);
                return show(data?.error === "email_not_registered"
                    ? "Пользователь с такой почтой не зарегистрирован."
                    : "Сервис временно недоступен, попробуйте позже.");
            }
            try {
                const data = await res.clone().json();
                if (data.error === "email_not_confirmed") return show("Почта ещё не подтверждена: сначала подтвердите её по ссылке из письма.");
            } catch { /* не JSON */ }
            show(await errorText(res));
        }

        // Параметры из ссылки в письме: #reset=1&email=...&code=...
        function readResetParams() {
            const p = new URLSearchParams(location.hash.slice(1));
            return p.get("reset") === "1" ? { email: p.get("email"), code: p.get("code") } : null;
        }
        let resetParams = readResetParams();
        if (resetParams) {
            history.replaceState(null, "", location.pathname);      // убираем код из адресной строки
            $("auth").hidden = true;
            $("reset").hidden = false;
        }

        async function doReset() {
            const pw = $("newPassword").value;
            if (pw !== $("newPassword2").value) return show("Пароли не совпадают");
            const res = await api("/resetPassword", {
                method: "POST",
                body: { email: resetParams.email, resetCode: resetParams.code, newPassword: pw }
            });
            if (!res.ok) return show(await errorText(res));
            resetParams = null;
            $("newPassword").value = $("newPassword2").value = "";
            $("reset").hidden = true;
            $("auth").hidden = false;
            setMode("login");
            show("Пароль изменён. Войдите с новым паролем.", true);
        }

        $("toRegister").onclick = e => { e.preventDefault(); setMode("register"); };
        $("forgotLink").onclick = e => { e.preventDefault(); setMode("forgot"); };
        $("toLogin").onclick = e => { e.preventDefault(); setMode("login"); };
        $("sendReset").onclick = sendReset;
        $("doReset").onclick = doReset;
        $("login").onclick = login;
        $("register").onclick = register;
        $("add").onclick = addTodo;
        $("logout").onclick = async () => {
            try { await api("/logout", { method: "POST" }); } catch { /* нет сети: выходим локально */ }
            logout();
        };
        if (token && !resetParams) showApp();
    </script>
    <link rel="stylesheet" href="/app/assets/app.css">
    <script type="module" src="/app/assets/app.js"></script>
</body>
</html>
